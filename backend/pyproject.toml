[project]
name = "inquiro-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "langgraph>=0.2",
    "sqlparse>=0.5",
    "weasyprint>=62.0",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "langgraph-cli[inmem]>=0.2",
    "pypdf>=5.0",
]
# Drivers de banco do usuário — opcionais, instalar só o que for usado.
# aioodbc ainda exige ODBC + "ODBC Driver 18 for SQL Server" no host.
mysql = ["aiomysql>=0.2"]
sqlserver = ["aioodbc>=0.5"]
all-databases = ["aiomysql>=0.2", "aioodbc>=0.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
